[package]
name = "forecast"
version = "0.1.0"
edition = "2024"

[dependencies]
fastrand = "2"
form_urlencoded = "1"
httpdate = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
tarantool = "7.0"

[lib]
crate-type = ["cdylib"]
