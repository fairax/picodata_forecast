[package]
name = "forecast"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
fibreq = "=0.2.0"
native-tls = { version = "0.2", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
shors = "=0.12.3"
tarantool = "6.1.0"
url = "2"
